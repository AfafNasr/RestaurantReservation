syntax = "proto3";

option csharp_namespace = "RestaurantReservation.API.Grpc";

package reservation;

service ReservationGrpc {
  rpc GetAllReservations (EmptyRequest) returns (ReservationListReply);
  rpc GetReservationById (GetReservationRequest) returns (ReservationReply);
  rpc CreateReservation (CreateReservationRequest) returns (ReservationReply);
  rpc UpdateReservation (UpdateReservationRequest) returns (ReservationReply);
  rpc DeleteReservation (DeleteReservationRequest) returns (DeleteReservationReply);
}

message EmptyRequest {
}

message GetReservationRequest {
  int32 id = 1;
}

message CreateReservationRequest {
  int32 customer_id = 1;
  int32 restaurant_id = 2;
  int32 table_id = 3;
  string reservation_date = 4;
  int32 party_size = 5;
}

message UpdateReservationRequest {
  int32 id = 1;
  int32 customer_id = 2;
  int32 restaurant_id = 3;
  int32 table_id = 4;
  string reservation_date = 5;
  int32 party_size = 6;
}

message DeleteReservationRequest {
  int32 id = 1;
}

message ReservationReply {
  int32 reservation_id = 1;
  int32 customer_id = 2;
  int32 restaurant_id = 3;
  int32 table_id = 4;
  string reservation_date = 5;
  int32 party_size = 6;
}

message ReservationListReply {
  repeated ReservationReply reservations = 1;
}

message DeleteReservationReply {
  bool success = 1;
  string message = 2;
}